{% extends "base.html" %}
{% block title %}Log in · Brightloop SMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "accounts/_form_fields.html" %}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
          <a href="{% url 'accounts:signup' %}">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
