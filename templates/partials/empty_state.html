{% comment %}
Reusable empty-state block.
Usage: {% include "partials/empty_state.html" with icon="bi-inbox" title="Nothing here yet" message="..." %}
{% endcomment %}
<div class="text-center text-muted py-5">
  <i class="bi {{ icon|default:'bi-inbox' }}" style="font-size: 2.5rem;"></i>
  <p class="mt-3 mb-0 fw-semibold">{{ title|default:"Nothing here yet" }}</p>
  {% if message %}<p class="small mb-0">{{ message }}</p>{% endif %}
</div>
