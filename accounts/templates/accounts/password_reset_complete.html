{% extends "base.html" %}
{% block title %}Password changed · Brightloop SMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm text-center">
      <div class="card-body p-4">
        <i class="bi bi-check-circle text-success" style="font-size: 2.5rem;"></i>
        <h4 class="mt-3">Password changed</h4>
        <p class="text-muted">You can now log in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
