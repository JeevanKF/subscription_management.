{% extends "base.html" %}
{% block title %}New staff · Brightloop SMS{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">New staff account</h1>
    <form method="post" novalidate class="card card-body">
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Create staff</button>
        <a class="btn btn-outline-secondary" href="{% url 'accounts:staff_list' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
