{% extends "base.html" %}
{% block title %}Check your email · Brightloop SMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm text-center">
      <div class="card-body p-4">
        <i class="bi bi-envelope-check text-success" style="font-size: 2.5rem;"></i>
        <h4 class="mt-3">Check your email</h4>
        <p class="text-muted">
          If an account exists for that address, we've sent a link to reset your password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
