{% extends "base.html" %}
{% block title %}Log in · Brightloop SMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">
          <i class="bi bi-lightning-charge-fill text-warning"></i> Brightloop SMS
        </h3>

        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Log in
          </button>
        </form>

        <div class="d-flex justify-content-between mt-3">
          <a href="{% url 'accounts:password_reset' %}" class="small">Forgot password?</a>
          <a href="{% url 'accounts:signup' %}" class="small">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
